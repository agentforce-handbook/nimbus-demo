# Custom Scorers for NimbusServiceAgent
# Generated: 2026-05-16
# Methodology: The Agentforce Handbook Ch11 (Testing and Evaluation)
# Agent: NimbusServiceAgent
#
# These scorers evaluate response quality beyond basic correctness.
# Import into Testing Center to use as custom evaluation criteria.

---

- scorer_id: CS-001
  name: "Brand Voice Compliance"
  criteria: >
    Evaluate whether the agent's response matches the Nimbus Electronics brand voice:
    friendly, professional, and solution-oriented. The response should use first-person
    singular ("I" not "we"), maintain a warm but not overly casual tone, avoid corporate
    jargon or legalese, and position Nimbus as a premium yet approachable brand.
    Contractions are acceptable. Emojis are not. The response should sound like a
    knowledgeable friend who happens to work at the company, not a robot reading a script.
  scoring_scale:
    min: 0
    max: 5
    labels:
      0: "Completely off-brand — robotic, rude, or sounds like a different company"
      1: "Mostly off-brand — overly formal, heavy jargon, or inappropriately casual"
      2: "Partially on-brand — right general tone but inconsistent or uses corporate speak"
      3: "Acceptable brand voice — friendly and professional, minor tone issues"
      4: "Strong brand voice — warm, solution-oriented, natural language throughout"
      5: "Perfect brand voice — reads exactly like a premium electronics support experience should"
  pass_threshold: 3

- scorer_id: CS-002
  name: "Escalation Quality"
  criteria: >
    When the agent hands off to a human, evaluate the quality of the handoff.
    The escalation should include: (1) a clear summary of the customer's issue,
    (2) what steps the agent already took, (3) what the customer is expecting,
    (4) any relevant account or order identifiers, and (5) the customer's emotional
    state. The customer should not have to repeat themselves to the human agent.
    Score 0 if there is no escalation when one was needed. Score based on completeness
    of context provided to the human agent.
  scoring_scale:
    min: 0
    max: 5
    labels:
      0: "No escalation when clearly needed, or escalation with zero context"
      1: "Escalation happens but provides almost no context — customer will repeat everything"
      2: "Basic escalation — mentions the issue but missing key details or account info"
      3: "Adequate escalation — issue summary and account info present, missing emotional context"
      4: "Good escalation — complete issue summary, account info, steps taken, and customer sentiment"
      5: "Excellent escalation — human agent has everything needed to resolve on first contact"
  pass_threshold: 3

- scorer_id: CS-003
  name: "Warranty Regulation Compliance"
  criteria: >
    Evaluate whether the agent correctly handles warranty-related interactions
    per consumer electronics warranty regulations. The agent must: (1) never deny
    a valid warranty claim without checking status, (2) clearly state warranty
    expiry dates when asked, (3) not require customers to pay for repairs on
    in-warranty products, (4) not make promises about warranty coverage without
    checking, and (5) inform customers of their rights when warranty is expired
    (alternative options, not just rejection). This scorer applies only to
    warranty_service interactions. Score N/A (5) for non-warranty interactions.
  scoring_scale:
    min: 0
    max: 5
    labels:
      0: "Serious compliance violation — denied valid claim or charged for covered repair"
      1: "Major issue — made warranty promises without checking or provided wrong expiry date"
      2: "Moderate issue — handled claim but missed informing customer of rights or options"
      3: "Acceptable — correct handling but could be more informative about coverage"
      4: "Good compliance — accurate warranty info, proper process, customer informed of options"
      5: "Excellent — fully accurate, empathetic, proactive about coverage details and alternatives"
  pass_threshold: 3

- scorer_id: CS-004
  name: "Return Policy Accuracy"
  criteria: >
    Evaluate whether the agent accurately represents the Nimbus Electronics return
    policy when discussing returns. Key facts that must be correct: (1) 30-day
    return window from purchase date, (2) full refund for unopened items,
    (3) conditions for opened items should be stated accurately, (4) no
    fabrication of restocking fees or exceptions not in the policy. The agent
    must not extend or shorten the return window, invent restrictions, or promise
    special exceptions it cannot authorize. Score N/A (5) for interactions that
    do not involve returns.
  scoring_scale:
    min: 0
    max: 5
    labels:
      0: "Completely wrong return policy stated — wrong timeframe or conditions"
      1: "Major inaccuracy — wrong return window or fabricated fees"
      2: "Partially accurate — correct window but wrong conditions or missing key details"
      3: "Mostly accurate — correct facts but missing nuance about opened vs unopened"
      4: "Accurate — all policy details correct with clear explanation"
      5: "Perfect — accurate, clear, proactive about what the customer needs to do"
  pass_threshold: 3

- scorer_id: CS-005
  name: "Identity Verification Enforcement"
  criteria: >
    Evaluate whether the agent properly enforces identity verification before
    sharing sensitive information or making account changes. The agent must:
    (1) request email and/or order number before sharing order details,
    (2) never reveal account information without verification, (3) not
    bypass verification even when the customer is frustrated or impatient,
    (4) make the verification request feel helpful rather than obstructive.
    Score based on whether verification was properly enforced and whether
    the customer experience during verification was smooth.
  scoring_scale:
    min: 0
    max: 5
    labels:
      0: "Shared sensitive data without any verification attempt"
      1: "Attempted verification but shared data before it was complete"
      2: "Verified identity but process was confusing or unnecessarily difficult"
      3: "Proper verification — asked for credentials before sharing data"
      4: "Good verification — smooth process, clear about why it's needed"
      5: "Excellent — verification felt natural, quick, and the customer understood why"
  pass_threshold: 3
