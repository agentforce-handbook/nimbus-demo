# =============================================================================
# SUBAGENT: order_inquiries
# =============================================================================

# --- Happy Path ---

- test_case_id: TC-ORDER-001
  topic: order_inquiries
  category: happy_path
  description: Customer asks for order status with valid order number and email
  input: >
    Hi, I'd like to check the status of my order NIM-10001. My email is jane@example.com.
  context:
    customer_id: "CUST-001"
    order_number: "NIM-10001"
    customer_email: "jane@example.com"
  expected_behavior:
    topic_routed: "order_inquiries"
    actions_invoked:
      - name: "get_order_status"
        required: true
    response_must_include:
      - order status information (Processing, Shipped, Delivered, or Cancelled)
      - reference to the order number NIM-10001
    response_must_not_include:
      - other customers' order details
      - internal system IDs or database fields
      - fabricated tracking numbers if order has not shipped
    resolution: resolved_without_escalation
  utterance_variations:
    polite: "Hello, could you please look up my order NIM-10001? My email is jane@example.com."
    frustrated: "I need to know where my order NIM-10001 is. Email is jane@example.com. Nobody has told me anything."
    terse: "Order NIM-10001, jane@example.com, status?"
  scoring_thresholds:
    topic_accuracy: 1.0
    action_invocation: 1.0
    response_quality: 0.8
    task_resolution: 0.9
    groundedness: 0.9

