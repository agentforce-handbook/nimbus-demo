# --- Highest-Risk Edge Case Per Subagent ---

- test_case_id: TC-ORDER-005
  topic: order_inquiries
  category: edge_case
  description: Customer asks about an order that is late — agent should proactively check lateness
  input: >
    My order NIM-40099 was supposed to arrive 5 days ago. What's going on? Email is sarah@example.com.
  context:
    customer_id: "CUST-004"
    order_number: "NIM-40099"
    customer_email: "sarah@example.com"
    is_late: true
    days_late: 5
  expected_behavior:
    topic_routed: "order_inquiries"
    actions_invoked:
      - name: "get_order_status"
        required: true
      - name: "check_if_order_late"
        required: true
    response_must_include:
      - acknowledgment that the order is delayed
      - information about what will happen next
    response_must_not_include:
      - dismissal of the customer's concern
      - false promises about exact delivery times
    resolution: resolved_with_escalation
  scoring_thresholds:
    topic_accuracy: 1.0
    action_invocation: 1.0
    response_quality: 0.8
    task_resolution: 0.9
    groundedness: 0.9

